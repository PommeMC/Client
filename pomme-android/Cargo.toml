[package]
name = "pomme-android"
description = "Android entry point for the Pomme client."
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
pomme-client = { path = "../pomme-client", default-features = false }
tracing = { workspace = true }
