# Chunk Detail, in Pomme Settings' Performance category (Pomme-only): the
# slider defaults to Off at its right end and steps down to 8 chunks at its
# left. Ends back on Off, since the options save.

pomme_only = true

[[step]]
press = { action = "key.menu" }

[[step]]
expect = { menu = "pause" }

# Options...
[[step]]
cursor = [161, 151]

[[step]]
mouse_down = "left"

[[step]]
mouse_up = "left"

# Pomme Settings, then its Performance category.
[[step]]
cursor_to_button = "Pomme Settings..."

[[step]]
mouse_down = "left"

[[step]]
mouse_up = "left"

[[step]]
cursor_to_button = "Performance..."

[[step]]
mouse_down = "left"

[[step]]
mouse_up = "left"

[[step]]
wait_ms = 300

[[step]]
screenshot = "off"

[[step]]
cursor = [60, 50]

[[step]]
mouse_down = "left"

[[step]]
mouse_up = "left"

[[step]]
wait_ms = 300

[[step]]
screenshot = "eight"

[[step]]
cursor = [207, 50]

[[step]]
mouse_down = "left"

[[step]]
mouse_up = "left"

# Done on Performance, on Pomme Settings, then on Options.
[[step]]
cursor = [213, 223]

[[step]]
mouse_down = "left"

[[step]]
mouse_up = "left"

[[step]]
wait_ms = 300

[[step]]
cursor = [213, 223]

[[step]]
mouse_down = "left"

[[step]]
mouse_up = "left"

[[step]]
wait_ms = 300

[[step]]
cursor = [213, 223]

[[step]]
mouse_down = "left"

[[step]]
mouse_up = "left"

[[step]]
wait_ms = 300

[[step]]
press = { action = "key.menu" }

[[step]]
expect = { menu = "none" }
