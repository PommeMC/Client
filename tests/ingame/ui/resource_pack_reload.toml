# Selecting a resource pack in game reloads what it changes and rebuilds the
# terrain: stone turns the pack's red, a container's title takes the pack's
# partial en_us.json while every other key keeps the base text, and
# deselecting it brings back the stock picture and title. The shots look down
# at the stone with the GUI hidden: the sky still brightens for a while after
# /time set, which would differ between them on its own.

[[step]]
wait_ms = 2000

[[step]]
chat = "/time set 6000"

[[step]]
chat = "/fill 40 -61 0 46 -61 8 minecraft:stone"

[[step]]
chat = "/setblock 43 -60 3 minecraft:dispenser[facing=north]"

[[step]]
chat = "/tp @s 43.5 -60 0.5 0 0"

[[step]]
expect = { player = { position = [43.5, -60.0, 0.5] } }

[[step]]
deterministic = true

[[step]]
wait_ms = 3000

[[step]]
look_at = [43.5, -61.0, 1.5]

[[step]]
press = { key = "key.keyboard.f1" }

[[step]]
wait_ms = 300

[[step]]
screenshot = "stock"

[[step]]
press = { key = "key.keyboard.f1" }

[[step]]
look_at = [43.5, -59.5, 3.0]

[[step]]
mouse_down = "right"

[[step]]
wait_ms = 150

[[step]]
mouse_up = "right"

[[step]]
expect = { menu = "generic_3x3", title = "Dispenser" }

[[step]]
close_menu = true

[[step]]
expect = { menu = "none" }

[[step]]
option = { resource_pack = "pomme_test" }

[[step]]
wait_ms = 3000

[[step]]
look_at = [43.5, -61.0, 1.5]

[[step]]
press = { key = "key.keyboard.f1" }

[[step]]
wait_ms = 300

[[step]]
screenshot = "pack"

[[step]]
press = { key = "key.keyboard.f1" }

[[step]]
look_at = [43.5, -59.5, 3.0]

[[step]]
mouse_down = "right"

[[step]]
wait_ms = 150

[[step]]
mouse_up = "right"

[[step]]
expect = { menu = "generic_3x3", title = "Pack Dispenser" }

[[step]]
close_menu = true

[[step]]
expect = { menu = "none" }

[[step]]
option = { resource_pack = "-pomme_test" }

[[step]]
wait_ms = 3000

[[step]]
look_at = [43.5, -61.0, 1.5]

[[step]]
press = { key = "key.keyboard.f1" }

[[step]]
wait_ms = 300

[[step]]
screenshot = "stock_again"

[[step]]
press = { key = "key.keyboard.f1" }

[[step]]
match_screenshots = ["stock", "stock_again"]

[[step]]
look_at = [43.5, -59.5, 3.0]

[[step]]
mouse_down = "right"

[[step]]
wait_ms = 150

[[step]]
mouse_up = "right"

[[step]]
expect = { menu = "generic_3x3", title = "Dispenser" }

[[step]]
close_menu = true

[[step]]
expect = { menu = "none" }

[[step]]
chat = "/fill 40 -61 0 46 -60 8 minecraft:air"

[[step]]
chat = "/fill 40 -61 0 46 -61 8 minecraft:grass_block"
