# A container the server opens replaces chat, as when chat opens between a
# right click on a chest and the server's answer.

[[step]]
wait_ms = 2000

[[step]]
chat = "/setblock 0 -60 3 minecraft:chest"

[[step]]
chat = "/tp @s 0.5 -60 0.5 0 0"

[[step]]
expect = { block = "chest", at = [0, -60, 3], block_entity = "chest" }

[[step]]
look_at = [0.5, -59.5, 3.0]

# The answer waits, as behind a slow connection.
[[step]]
hold_packets = true

[[step]]
mouse_down = "right"

[[step]]
wait_ms = 150

[[step]]
mouse_up = "right"

[[step]]
press = { action = "key.chat" }

[[step]]
expect = { hud = { chat_open = true } }

[[step]]
hold_packets = false

[[step]]
expect = { menu = "generic_9x3", title = "Chest" }

[[step]]
expect = { hud = { chat_open = false } }

[[step]]
wait_ms = 500

[[step]]
screenshot = "chest"

[[step]]
chat = "/setblock 0 -60 3 minecraft:air"

[[step]]
expect = { menu = "none" }
