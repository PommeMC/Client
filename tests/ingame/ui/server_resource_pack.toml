# A server that requires a resource pack has it applied on join: stone turns
# the pack's red and a container's title takes the pack's en_us.json. The
# runner serves the fixture pack and starts this script's own server with it.
server_resource_pack = "pomme_test"

[[step]]
wait_ms = 2000

[[step]]
chat = "/time set 6000"

[[step]]
chat = "/fill 40 -61 0 46 -61 8 minecraft:stone"

[[step]]
chat = "/setblock 43 -60 3 minecraft:dispenser[facing=north]"

[[step]]
chat = "/tp @s 43.5 -60 0.5 0 0"

[[step]]
expect = { player = { position = [43.5, -60.0, 0.5] } }

[[step]]
expect = { block = "dispenser", at = [43, -60, 3] }

[[step]]
wait_ms = 3000

[[step]]
look_at = [43.5, -61.0, 1.5]

[[step]]
press = { key = "key.keyboard.f1" }

[[step]]
wait_ms = 300

[[step]]
screenshot = "server_pack"

[[step]]
press = { key = "key.keyboard.f1" }

[[step]]
look_at = [43.5, -59.5, 3.0]

[[step]]
mouse_down = "right"

[[step]]
wait_ms = 150

[[step]]
mouse_up = "right"

[[step]]
expect = { menu = "generic_3x3", title = "Pack Dispenser" }

[[step]]
close_menu = true
