# Pomme's own settings (Pomme-only): a button under the Options grid opens
# them, one screen per category. Performance holds Chunk Detail and Distant
# Terrain, Shaders holds Shader Pack, Updates holds Client Updates.

pomme_only = true

[[step]]
press = { action = "key.menu" }

[[step]]
expect = { menu = "pause" }

