# A connection that is refused shows the disconnected screen titled "Failed
# to connect to the server", and its button opens the server list.

[[step]]
wait_ms = 2000

[[step]]
press = { action = "key.menu" }

[[step]]
expect = { menu = "pause" }

[[step]]
cursor_to_button = "Disconnect"

[[step]]
mouse_down = "left"

[[step]]
wait_ms = 100

[[step]]
mouse_up = "left"

[[step]]
expect = { screen = "server_list" }

[[step]]
cursor_to_button = "Direct Connection"

[[step]]
mouse_down = "left"

[[step]]
wait_ms = 100

[[step]]
mouse_up = "left"

[[step]]
expect = { screen = "direct_connect" }

[[step]]
press = { key = "key.keyboard.a", ctrl = true }

# Nothing listens on port 1.
[[step]]
text = "127.0.0.1:1"

[[step]]
press = { key = "key.keyboard.enter" }

[[step]]
wait_ms = 5000

[[step]]
cursor_to_button = "Back to Server List"

[[step]]
screenshot = "connect_failed"

[[step]]
mouse_down = "left"

[[step]]
wait_ms = 100

[[step]]
mouse_up = "left"

[[step]]
expect = { screen = "server_list" }
