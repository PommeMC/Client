# Video Settings' "Reduce fps when" button: AFK by default with its tooltip
# when hovered, Minimized once clicked. Ends back on AFK, since the options
# save.
# TODO: the throttle itself isn't reached here; a script's window is never
# idle or minimised.

# Settings outlive a run, so start from the default.
[[step]]
option = { inactivity_fps_limit = "afk" }

[[step]]
press = { action = "key.menu" }

[[step]]
expect = { menu = "pause" }

# Options...
[[step]]
cursor = [161, 151]

[[step]]
mouse_down = "left"

[[step]]
mouse_up = "left"

# Video Settings...
[[step]]
cursor = [133, 115]

[[step]]
mouse_down = "left"

[[step]]
mouse_up = "left"

[[step]]
wait_ms = 300

[[step]]
cursor_to_button = "Reduce fps when: AFK"

[[step]]
wait_ms = 100

[[step]]
screenshot = "afk"

[[step]]
mouse_down = "left"

[[step]]
mouse_up = "left"

[[step]]
wait_ms = 100

[[step]]
cursor_to_button = "Reduce fps when: Minimized"

# Off the button, so its tooltip doesn't cover the value.
[[step]]
cursor = [2, 2]

[[step]]
wait_ms = 100

[[step]]
screenshot = "minimized"

[[step]]
cursor_to_button = "Reduce fps when: Minimized"

[[step]]
mouse_down = "left"

[[step]]
mouse_up = "left"

[[step]]
wait_ms = 100

[[step]]
cursor_to_button = "Reduce fps when: AFK"

[[step]]
screenshot = "afk_again"

# Done, then Done again on Options.
[[step]]
cursor = [213, 223]

[[step]]
mouse_down = "left"

[[step]]
mouse_up = "left"

[[step]]
wait_ms = 300

[[step]]
cursor = [213, 223]

[[step]]
mouse_down = "left"

[[step]]
mouse_up = "left"

[[step]]
wait_ms = 300

[[step]]
press = { action = "key.menu" }

[[step]]
expect = { menu = "none" }
