# Titles and a boss bar arrive from the server, update and clear.

[[step]]
wait_ms = 2000

[[step]]
chat = "/title @a times 10 400 10"

[[step]]
chat = "/title @a subtitle \"sub\""

[[step]]
chat = "/title @a title \"Hello\""

[[step]]
expect = { hud = { title = "Hello", subtitle = "sub" } }

[[step]]
chat = "/bossbar add pomme:test \"Test Bar\""

[[step]]
chat = "/bossbar set pomme:test players @a"

[[step]]
chat = "/bossbar set pomme:test value 50"

[[step]]
expect = { hud = { boss_bars = ["Test Bar"] } }

# Past the title's fade-in and the bar's progress lerp.
[[step]]
wait_ms = 500

[[step]]
screenshot = "title_and_boss_bar"

[[step]]
chat = "/bossbar set pomme:test name \"Renamed\""

[[step]]
expect = { hud = { boss_bars = ["Renamed"] } }

[[step]]
chat = "/title @a clear"

[[step]]
expect = { hud = { title = "" } }

[[step]]
screenshot = "renamed_boss_bar"

[[step]]
chat = "/bossbar remove pomme:test"

[[step]]
expect = { hud = { boss_bars = [] } }

# Vanilla's font decomposes legacy codes in every string, not only chat.
[[step]]
chat = "/title @a title \"\\u00a7cRed \\u00a7lBold\""

[[step]]
wait_ms = 500

[[step]]
screenshot = "legacy_codes"

[[step]]
chat = "/title @a reset"

# Titles draw under an open screen.
[[step]]
chat = "/title @a times 10 400 10"

[[step]]
chat = "/title @a title \"Covered\""

[[step]]
expect = { hud = { title = "Covered" } }

[[step]]
open_inventory = true

[[step]]
wait_ms = 500

[[step]]
screenshot = "title_under_inventory"

[[step]]
close_menu = true

[[step]]
chat = "/title @a reset"

# Subtitles draw over a container screen, with F1 too, and under the pause
# menu.
[[step]]
option = { show_subtitles = true }

[[step]]
press = { key = "key.keyboard.f1" }

# A tick for the key to register before a screen opens.
[[step]]
wait_ms = 200

[[step]]
open_inventory = true

[[step]]
chat = "/playsound minecraft:block.note_block.pling master @a"

[[step]]
expect = { sound = "block.note_block.pling" }

[[step]]
wait_ms = 300

[[step]]
screenshot = "subtitles_over_inventory"

[[step]]
close_menu = true

[[step]]
press = { key = "key.keyboard.f1" }

[[step]]
press = { action = "key.menu" }

[[step]]
expect = { menu = "pause" }

[[step]]
chat = "/playsound minecraft:block.note_block.pling master @a"

[[step]]
expect = { sound = "block.note_block.pling" }

[[step]]
wait_ms = 300

[[step]]
screenshot = "subtitles_under_pause"

[[step]]
press = { action = "key.menu" }

[[step]]
expect = { menu = "none" }

[[step]]
option = { show_subtitles = false }
