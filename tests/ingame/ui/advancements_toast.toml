# Granting an advancement reaches the client and announces it in chat.

[[step]]
wait_ms = 2000

[[step]]
chat = "/advancement grant @s only minecraft:story/mine_stone"

[[step]]
expect = { chat = "Stone Age" }

[[step]]
expect = { advancement = "minecraft:story/mine_stone" }

# A tab root, which carries a background.
[[step]]
expect = { advancement = "minecraft:story/root" }

# Let the toast slide in (vanilla ToastManager's 600 ms animation).
[[step]]
wait_ms = 1000

[[step]]
screenshot = "toast"
