# Container screens, each opened by a right click on its block: anvil,
# crafting table, the furnaces, a shulker box and a double chest. Then an
# ender chest, a trapped chest and a shulker box, closed.

[[step]]
wait_ms = 2000

[[step]]
chat = "/gamemode creative"

[[step]]
chat = "/clear @s"

[[step]]
chat = "/tp @s 1112.5 -60 0.5 0 0"

[[step]]
expect = { player = { position = [1112.5, -60.0, 0.5] } }

# The chunks are loaded once the client has them.

[[step]]
expect = { block = "grass_block", at = [1100, -61, 3] }

[[step]]
chat = "/setblock 1100 -60 3 minecraft:anvil[facing=east]"

[[step]]
expect = { block = "anvil", at = [1100, -60, 3] }

[[step]]
chat = "/setblock 1104 -60 3 minecraft:crafting_table"

[[step]]
expect = { block = "crafting_table", at = [1104, -60, 3] }

