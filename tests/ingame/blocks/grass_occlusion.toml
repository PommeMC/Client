# Faces buried against grass blocks: at this pitch a row of pixel centres
# lands exactly on the z = 18 block edge. The grass block's side overlays
# once kept it from hiding its neighbours' faces, and those unlit faces won
# that row's depth tie, drawing a dark line across the ground.

[[step]]
wait_ms = 2000

[[step]]
chat = "/gamemode creative"

[[step]]
chat = "/gamerule advance_time false"

[[step]]
chat = "/time set 6000"

[[step]]
chat = "/fill 0 -60 0 0 -58 0 minecraft:stone"

[[step]]
chat = "/tp @s 0.5 -57 0.5 0 45.753849"

[[step]]
expect = { player = { position = [0.5, -57.0, 0.5] } }

# Chat fades after 10 seconds.
[[step]]
wait_ms = 11000

[[step]]
screenshot = "grass_edge"

[[step]]
chat = "/fill 0 -60 0 0 -58 0 minecraft:air"
