# Animated block textures play: a sea lantern steps through its frames, magma
# and prismarine blend between theirs. Screenshots a few ticks apart differ on
# the blocks.

[[step]]
wait_ms = 2000

[[step]]
chat = "/time set 6000"

[[step]]
chat = "/gamemode spectator"

[[step]]
chat = "/setblock -32 -60 33 minecraft:sea_lantern"

[[step]]
chat = "/setblock -31 -60 33 minecraft:magma_block"

[[step]]
chat = "/setblock -30 -60 33 minecraft:prismarine"

[[step]]
expect = { block = "prismarine", at = [-30, -60, 33] }

[[step]]
chat = "/tp @s -30.5 -59.5 31 0 25"

# Hidden GUI keeps command feedback off the blocks.
[[step]]
press = { action = "key.toggleGui" }

[[step]]
wait_ms = 1500

[[step]]
screenshot = "first"

[[step]]
wait_ms = 350

[[step]]
screenshot = "second"

[[step]]
wait_ms = 350

[[step]]
screenshot = "third"

[[step]]
press = { action = "key.toggleGui" }

[[step]]
chat = "/fill -32 -60 33 -30 -60 33 minecraft:air"

[[step]]
chat = "/gamemode survival"
