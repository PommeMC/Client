# Sign text: standing signs in black, a red dye and glowing red, a hanging
# sign with styled lines, and a wall sign (hidden for now behind the standing
# board Pomme also draws there); then a sign placed by hand, its editor typed
# into, and the text the server took copied to a second sign.

[[step]]
wait_ms = 2000

[[step]]
chat = "/gamemode creative"

[[step]]
chat = "/gamerule advance_time false"

[[step]]
chat = "/time set 6000"

[[step]]
chat = "/tp @s 200.5 -60 0.5 0 0"

[[step]]
expect = { player = { position = [200.5, -60.0, 0.5] } }

# The chunks are loaded once the client has them.
[[step]]
expect = { block = "grass_block", at = [200, -61, 3] }

[[step]]
chat = "/setblock 198 -60 3 minecraft:oak_sign[rotation=8]{front_text:{messages:[\"Hello\",\"Plain\",\"\",\"\"]}}"

[[step]]
chat = "/setblock 200 -60 3 minecraft:oak_sign[rotation=8]{front_text:{color:\"red\",messages:[\"Red dye\",\"\",\"\",\"\"]}}"

[[step]]
chat = "/setblock 202 -60 3 minecraft:spruce_sign[rotation=8]{front_text:{color:\"red\",has_glowing_text:1b,messages:[\"Glow red\",\"\",\"\",\"\"]}}"

[[step]]
chat = "/setblock 200 -58 3 minecraft:oak_hanging_sign[rotation=8]{front_text:{messages:[{text:\"Gold\",color:\"gold\"},{text:\"Bold\",bold:1b},\"\",\"\"]}}"

[[step]]
chat = "/setblock 198 -59 4 minecraft:stone"

[[step]]
chat = "/setblock 198 -59 3 minecraft:oak_wall_sign[facing=north]{front_text:{messages:[\"Wall\",\"\",\"\",\"\"]}}"

[[step]]
expect = { block = "oak_wall_sign", at = [198, -59, 3], block_entity = "sign" }

# Chat fades after 10 seconds.
[[step]]
wait_ms = 11000

[[step]]
screenshot = "signs"

[[step]]
chat = "/fill 196 -60 3 204 -57 4 minecraft:air"

# Placing a sign opens its editor.
[[step]]
chat = "/item replace entity @s weapon.mainhand with minecraft:birch_sign"

[[step]]
expect = { slot = 36, item = "birch_sign" }

[[step]]
look_at = [200.5, -60.01, 2.5]

[[step]]
mouse_down = "right"

[[step]]
wait_ms = 150

[[step]]
mouse_up = "right"

[[step]]
expect = { menu = "sign" }

[[step]]
text = "Hello"

[[step]]
press = { key = "key.keyboard.enter" }

[[step]]
text = "Pomme sign"

[[step]]
screenshot = "editor"

[[step]]
press = { action = "key.menu" }

[[step]]
expect = { menu = "none" }

# A copy shows the text the server stored.
[[step]]
chat = "/clone 200 -60 2 200 -60 2 202 -60 2"

[[step]]
expect = { block = "birch_sign", at = [202, -60, 2], block_entity = "sign" }

[[step]]
look_at = [201.5, -59.5, 4.0]

[[step]]
wait_ms = 11000

[[step]]
screenshot = "edited"

[[step]]
chat = "/fill 196 -60 2 204 -57 4 minecraft:air"

[[step]]
chat = "/item replace entity @s weapon.mainhand with minecraft:air"

[[step]]
chat = "/gamerule advance_time true"
