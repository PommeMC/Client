# The hopper, dispenser and dropper open through a right click with their
# contents, and a shift click moves the stack to the last free hotbar slot.
# The blocks stay until the end: the server runs commands apart from clicks,
# so removing one could beat the click that empties it.

[[step]]
wait_ms = 2000

[[step]]
chat = "/clear @s"

[[step]]
chat = "/setblock 40 -60 3 minecraft:hopper{Items:[{Slot:0b,id:\"minecraft:diamond\",count:3}]}"

[[step]]
expect = { block = "hopper", at = [40, -60, 3] }

[[step]]
chat = "/setblock 44 -60 3 minecraft:dispenser{Items:[{Slot:0b,id:\"minecraft:emerald\",count:3}]}"

[[step]]
expect = { block = "dispenser", at = [44, -60, 3] }

[[step]]
chat = "/setblock 48 -60 3 minecraft:dropper{Items:[{Slot:0b,id:\"minecraft:gold_ingot\",count:3}]}"

[[step]]
expect = { block = "dropper", at = [48, -60, 3] }

[[step]]
chat = "/tp @s 40.5 -60 0.5 0 0"

[[step]]
expect = { player = { position = [40.5, -60.0, 0.5] } }

[[step]]
look_at = [40.5, -59.5, 3.0]

[[step]]
mouse_down = "right"

[[step]]
wait_ms = 150

[[step]]
mouse_up = "right"

[[step]]
expect = { menu = "hopper", title = "Item Hopper" }

[[step]]
expect = { slot = 0, item = "diamond", count = 3 }

[[step]]
wait_ms = 500

[[step]]
screenshot = "hopper"

[[step]]
click = { slot = 0, op = "quick_move" }

[[step]]
expect = { slot = 40, item = "diamond", count = 3 }

[[step]]
close_menu = true

[[step]]
expect = { menu = "none" }

[[step]]
chat = "/tp @s 44.5 -60 0.5 0 0"

[[step]]
expect = { player = { position = [44.5, -60.0, 0.5] } }

[[step]]
look_at = [44.5, -59.5, 3.0]

[[step]]
mouse_down = "right"

[[step]]
wait_ms = 150

[[step]]
mouse_up = "right"

[[step]]
expect = { menu = "generic_3x3", title = "Dispenser" }

[[step]]
expect = { slot = 0, item = "emerald", count = 3 }

[[step]]
wait_ms = 500

[[step]]
screenshot = "dispenser"

[[step]]
click = { slot = 0, op = "quick_move" }

[[step]]
expect = { slot = 43, item = "emerald", count = 3 }

[[step]]
close_menu = true

[[step]]
expect = { menu = "none" }

[[step]]
chat = "/tp @s 48.5 -60 0.5 0 0"

[[step]]
expect = { player = { position = [48.5, -60.0, 0.5] } }

[[step]]
look_at = [48.5, -59.5, 3.0]

[[step]]
mouse_down = "right"

[[step]]
wait_ms = 150

[[step]]
mouse_up = "right"

[[step]]
expect = { menu = "generic_3x3", title = "Dropper" }

[[step]]
expect = { slot = 0, item = "gold_ingot", count = 3 }

[[step]]
wait_ms = 500

[[step]]
screenshot = "dropper"

[[step]]
click = { slot = 0, op = "quick_move" }

[[step]]
expect = { slot = 42, item = "gold_ingot", count = 3 }

[[step]]
close_menu = true

[[step]]
expect = { menu = "none" }

[[step]]
wait_ms = 500

[[step]]
chat = "/fill 40 -60 3 48 -60 3 minecraft:air"

[[step]]
chat = "/clear @s"
