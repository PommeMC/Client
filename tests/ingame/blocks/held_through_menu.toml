# A button pressed in a screen doesn't count as held once the screen
# closes: pressing Back to Game and holding on leaves the leaves in view
# alone, and only a fresh press breaks them.

[[step]]
wait_ms = 2000

[[step]]
chat = "/gamemode survival"

[[step]]
chat = "/clear @s"

[[step]]
chat = "/tp @s 1190.5 -60 0.5 0 0"

[[step]]
expect = { player = { position = [1190.5, -60.0, 0.5] } }

# The chunks are loaded once the client has them.
[[step]]
expect = { block = "grass_block", at = [1190, -61, 2] }

[[step]]
chat = "/setblock 1190 -59 2 minecraft:oak_leaves[persistent=true]"

[[step]]
expect = { block = "oak_leaves", at = [1190, -59, 2] }

[[step]]
look_at = [1190.5, -58.5, 2.0]

[[step]]
press = { key = "key.keyboard.escape" }

[[step]]
expect = { menu = "pause" }

# Back to Game
[[step]]
cursor = [214, 79]

[[step]]
mouse_down = "left"

[[step]]
expect = { menu = "none" }

# Leaves take 6 ticks by hand.
[[step]]
wait_ticks = 20

[[step]]
expect = { block = "oak_leaves", at = [1190, -59, 2] }
timeout_ms = 1

[[step]]
mouse_up = "left"

[[step]]
mouse_down = "left"

[[step]]
expect = { block = "air", at = [1190, -59, 2] }

[[step]]
mouse_up = "left"

[[step]]
chat = "/kill @e[type=item,x=1190,y=-59,z=2,distance=..4]"

[[step]]
chat = "/gamemode creative"
