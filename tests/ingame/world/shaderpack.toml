# A shader pack (fixtures/shaderpacks/pomme_test) draws the world: the sky
# through its `gbuffers_skybasic` (the disc tinted red by `renderStage`) and
# `gbuffers_skytextured` programs, terrain, a cow and a chest through its
# `gbuffers_textured_lit`, normal shading and the shadows of a pillar, the
# planks, the cow, the chest and the player (its `shadow` program, the sun
# tilted by `sunPathRotation`) from its composite pass, and the sky blended
# toward a custom uniform from its `shaders.properties`. Then packs off again,
# with the same sky shots to compare.

[[step]]
wait_ms = 2000

[[step]]
chat = "/gamerule advance_time false"

[[step]]
chat = "/gamemode creative"

[[step]]
chat = "/time set 6000"

[[step]]
chat = "/tp @s 60.5 -60 50.5 0 15"

[[step]]
expect = { player = { position = [60.5, -60.0, 50.5] } }

[[step]]
chat = "/summon minecraft:cow 59.5 -60 54.5 {NoAI:1b,Rotation:[90f,0f],Tags:[\"pack\"]}"

[[step]]
chat = "/setblock 62 -60 54 minecraft:chest[facing=north]"

[[step]]
chat = "/fill 63 -60 55 64 -59 56 minecraft:oak_planks"

[[step]]
chat = "/fill 54 -60 53 54 -58 53 minecraft:stone"

[[step]]
expect = { entity = "cow" }

[[step]]
press = { action = "key.toggleGui" }

[[step]]
deterministic = true

[[step]]
option = { shader_pack = "pomme_test" }

[[step]]
wait_ms = 3000

[[step]]
screenshot = "pack"

# The shadows fall south, away from the noon sun tilted north.
[[step]]
chat = "/tp @s 54.5 -60 58.5 180 35"

[[step]]
wait_ms = 1000

[[step]]
screenshot = "pack_shadow"

# The cow and the chest cast shadows too.
[[step]]
chat = "/tp @s 60.5 -60 58.5 180 35"

[[step]]
wait_ms = 1000

[[step]]
screenshot = "pack_entity_shadow"

# In first person the player still casts one, south of its feet.
[[step]]
chat = "/tp @s 60.5 -60 50.5 0 90"

[[step]]
wait_ms = 1000

[[step]]
screenshot = "pack_self_shadow"

# The sun overhead at noon, the moon and stars at midnight, then the sunset
# glow to the west at dusk.
[[step]]
chat = "/tp @s 60.5 -60 50.5 0 -90"

[[step]]
wait_ms = 1000

[[step]]
screenshot = "pack_sun"

[[step]]
chat = "/time set 18000"

[[step]]
wait_ms = 1000

[[step]]
screenshot = "pack_night"

[[step]]
chat = "/time set 12600"

[[step]]
chat = "/tp @s 60.5 -60 50.5 90 -10"

[[step]]
wait_ms = 1000

[[step]]
screenshot = "pack_dusk"

[[step]]
chat = "/time set 6000"

[[step]]
chat = "/tp @s 60.5 -60 50.5 0 15"

[[step]]
wait_ms = 1000

# A pack with no composite or final: its gbuffers output reaches the screen
# as it is, the sky the fog colour colortex0 clears to.
[[step]]
option = { shader_pack = "pomme_nofinal" }

[[step]]
wait_ms = 3000

[[step]]
screenshot = "no_final"

[[step]]
option = { shader_pack = "" }

[[step]]
wait_ms = 1500

[[step]]
screenshot = "off"

# With no pack, the first-person player casts no blob shadow.
[[step]]
chat = "/tp @s 60.5 -60 50.5 0 90"

[[step]]
wait_ms = 1000

[[step]]
screenshot = "off_self"

# The sun overhead at noon, the moon and stars at midnight, then the sunset
# glow to the west at dusk.
[[step]]
chat = "/tp @s 60.5 -60 50.5 0 -90"

[[step]]
wait_ms = 1000

[[step]]
screenshot = "off_sun"

[[step]]
chat = "/time set 18000"

[[step]]
wait_ms = 1000

[[step]]
screenshot = "off_night"

[[step]]
chat = "/time set 12600"

[[step]]
chat = "/tp @s 60.5 -60 50.5 90 -10"

[[step]]
wait_ms = 1000

[[step]]
screenshot = "off_dusk"

[[step]]
chat = "/time set 6000"

[[step]]
chat = "/tp @s 60.5 -60 50.5 0 15"

[[step]]
wait_ms = 1000

[[step]]
chat = "/kill @e[tag=pack]"

[[step]]
chat = "/kill @e[type=item]"

[[step]]
chat = "/fill 62 -60 54 64 -59 56 minecraft:air"

[[step]]
chat = "/fill 54 -60 53 54 -58 53 minecraft:air"

[[step]]
press = { action = "key.toggleGui" }

[[step]]
chat = "/gamemode survival"

[[step]]
chat = "/gamerule advance_time true"
