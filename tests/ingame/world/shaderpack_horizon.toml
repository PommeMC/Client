# The horizon through a shader pack (fixtures/shaderpacks/pomme_test): above
# the flat world, standing on a barrier so both shots share the eye, the sky
# below the top disc's edge goes through `gbuffers_skybasic` as Iris's
# horizon, tinted red with the disc by `renderStage`, rather than the pack's
# cleared colour. Then packs off, with the same shot to compare.

[[step]]
wait_ms = 2000

[[step]]
chat = "/gamerule advance_time false"

[[step]]
chat = "/gamemode creative"

[[step]]
chat = "/time set 6000"

[[step]]
chat = "/setblock 0 -21 0 minecraft:barrier"

[[step]]
chat = "/tp @s 0.5 -20 0.5 0 10"

[[step]]
expect = { player = { position = [0.5, -20.0, 0.5] } }

[[step]]
press = { action = "key.toggleGui" }

[[step]]
option = { shader_pack = "pomme_test" }

[[step]]
wait_ms = 3000

[[step]]
expect = { terrain = "settled" }

[[step]]
expect = { player = { position = [0.5, -20.0, 0.5] } }

[[step]]
screenshot = "pack_horizon"

[[step]]
option = { shader_pack = "" }

[[step]]
wait_ms = 1500

[[step]]
expect = { terrain = "settled" }

[[step]]
expect = { player = { position = [0.5, -20.0, 0.5] } }

[[step]]
screenshot = "off_horizon"

[[step]]
press = { action = "key.toggleGui" }

[[step]]
chat = "/setblock 0 -21 0 minecraft:air"

[[step]]
chat = "/gamemode survival"

[[step]]
chat = "/gamerule advance_time true"
