# Chunk arenas too small for the render distance: the farthest columns are
# evicted and wait while every nearer one draws, come back once arenas can be
# added, and compaction drains what a lower distance leaves empty. The arena
# steps do nothing on vanilla.

[[step]]
wait_ms = 2000

[[step]]
chat = "/gamemode creative"

[[step]]
chat = "/gamerule advance_time false"

[[step]]
chat = "/time set 6000"

# A pillar to look out from.
[[step]]
chat = "/fill 0 -60 0 0 -51 0 minecraft:stone"

[[step]]
chat = "/tp @s 0.5 -50 0.5 0 20"

[[step]]
deterministic = true

[[step]]
option = { render_distance = 4 }

[[step]]
chunk_arenas = { vertices = 32768, max = 1 }

[[step]]
expect = { terrain = "settled" }
timeout_ms = 30000

[[step]]
chunk_arenas = { vertices = 32768, max = 256 }

[[step]]
expect = { terrain = "settled" }
timeout_ms = 30000

# Chat fades after 10 seconds.
[[step]]
wait_ms = 11000

[[step]]
screenshot = "far"

[[step]]
option = { render_distance = 2 }

# The far columns unload over a few ticks.
[[step]]
wait_ms = 3000

[[step]]
expect = { terrain = "compacted" }
timeout_ms = 30000

# Back to the default, which the server's 4 caps.
[[step]]
option = { render_distance = 12 }

[[step]]
chat = "/fill 0 -60 0 0 -51 0 minecraft:air"

[[step]]
chat = "/gamerule advance_time true"
