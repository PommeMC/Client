# Armadillos at rest, three-quarter view from above: an adult and a baby
# (its own mesh) standing, then an adult and a baby rolled up in the scared
# state, where the shell cube replaces the body and hind legs.

[[step]]
wait_ms = 2000

[[step]]
chat = "/gamemode creative"

[[step]]
chat = "/gamerule advance_time false"

[[step]]
chat = "/time set 6000"

[[step]]
deterministic = true

# A pillar to look down from.
[[step]]
chat = "/fill 0 -60 0 0 -59 0 minecraft:stone"

[[step]]
chat = "/tp @s 0.5 -58 0.5 0 40"

[[step]]
expect = { player = { position = [0.5, -58.0, 0.5] } }

[[step]]
chat = "/summon minecraft:armadillo -1.5 -60 3.5 {NoAI:1b,Rotation:[150f,0f]}"

[[step]]
expect = { entity = "armadillo", baby = false }

[[step]]
chat = "/summon minecraft:armadillo -0.25 -60 3.5 {NoAI:1b,Age:-24000,Rotation:[210f,0f]}"

[[step]]
expect = { entity = "armadillo", baby = true }

[[step]]
chat = "/summon minecraft:armadillo 1.25 -60 3.5 {NoAI:1b,state:\"scared\",Rotation:[150f,0f]}"

[[step]]
chat = "/summon minecraft:armadillo 2.5 -60 3.5 {NoAI:1b,Age:-24000,state:\"scared\",Rotation:[210f,0f]}"

[[step]]
look_at = [0.5, -59.8, 3.5]

# Chat fades after 10 seconds.
[[step]]
wait_ms = 11000

[[step]]
screenshot = "armadillos"

[[step]]
chat = "/kill @e[type=!player]"

[[step]]
chat = "/fill 0 -60 0 0 -59 0 minecraft:air"

[[step]]
chat = "/gamerule advance_time true"
