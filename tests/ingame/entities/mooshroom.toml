# Red and brown mooshrooms with their babies, side on. Adults carry
# mushroom blocks on the back and head (MushroomCowMushroomLayer).

[[step]]
wait_ms = 2000

[[step]]
chat = "/gamemode creative"

[[step]]
chat = "/gamerule advance_time false"

[[step]]
chat = "/time set 6000"

[[step]]
deterministic = true

# A pillar to look down from.
[[step]]
chat = "/fill 0 -60 0 0 -58 0 minecraft:stone"

[[step]]
chat = "/tp @s 0.5 -57 0.5 0 40"

[[step]]
expect = { player = { position = [0.5, -57.0, 0.5] } }

[[step]]
chat = '/summon minecraft:mooshroom -2.5 -60 6.5 {NoAI:1b,Type:"red",Rotation:[90f,0f]}'

[[step]]
chat = '/summon minecraft:mooshroom -0.5 -60 6.5 {NoAI:1b,Type:"brown",Rotation:[90f,0f]}'

[[step]]
expect = { entity = "mooshroom", baby = false }

[[step]]
chat = '/summon minecraft:mooshroom 1.5 -60 6.5 {NoAI:1b,Type:"red",Age:-24000,Rotation:[90f,0f]}'

[[step]]
chat = '/summon minecraft:mooshroom 3 -60 6.5 {NoAI:1b,Type:"brown",Age:-24000,Rotation:[90f,0f]}'

[[step]]
expect = { entity = "mooshroom", baby = true }

[[step]]
look_at = [0.25, -59.5, 6.5]

# Chat fades after 10 seconds.
[[step]]
wait_ms = 11000

[[step]]
screenshot = "mooshrooms"

[[step]]
chat = "/kill @e[type=!player]"

[[step]]
chat = "/fill 0 -60 0 0 -58 0 minecraft:air"

[[step]]
chat = "/gamerule advance_time true"
