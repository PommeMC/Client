# Bees at rest on the ground, three-quarter view from above: plain, nectar,
# angry, angry with nectar, stung (no stinger), a baby and a baby with
# nectar, plus a hovering adult and baby (flying pose: wings out, legs
# tucked, bobbing). Each texture is picked from the angry/nectar flags.

[[step]]
wait_ms = 2000

[[step]]
chat = "/gamemode creative"

[[step]]
chat = "/gamerule advance_time false"

[[step]]
chat = "/time set 6000"

[[step]]
deterministic = true

# A pillar to look down from.
[[step]]
chat = "/fill -30 -60 0 -30 -58 0 minecraft:stone"

[[step]]
chat = "/tp @s -29.5 -57 0.5 0 40"

[[step]]
expect = { player = { position = [-29.5, -57.0, 0.5] } }

[[step]]
chat = "/summon minecraft:bee -32.5 -60 3.5 {NoAI:1b,Rotation:[150f,0f]}"

[[step]]
chat = "/summon minecraft:bee -31.5 -60 3.5 {NoAI:1b,HasNectar:1b,Rotation:[150f,0f]}"

[[step]]
chat = "/summon minecraft:bee -30.5 -60 3.5 {NoAI:1b,anger_end_time:2000000000L,Rotation:[150f,0f]}"

[[step]]
chat = "/summon minecraft:bee -29.5 -60 3.5 {NoAI:1b,HasNectar:1b,anger_end_time:2000000000L,Rotation:[150f,0f]}"

[[step]]
chat = "/summon minecraft:bee -28.5 -60 3.5 {NoAI:1b,HasStung:1b,Rotation:[210f,0f]}"

[[step]]
chat = "/summon minecraft:bee -27.5 -60 3.5 {NoAI:1b,Age:-24000,Rotation:[210f,0f]}"

[[step]]
chat = "/summon minecraft:bee -26.5 -60 3.5 {NoAI:1b,Age:-24000,HasNectar:1b,Rotation:[210f,0f]}"

[[step]]
chat = "/summon minecraft:bee -31 -59 5.5 {NoAI:1b,NoGravity:1b,Rotation:[180f,0f]}"

[[step]]
chat = "/summon minecraft:bee -28 -59 5.5 {NoAI:1b,NoGravity:1b,Age:-24000,Rotation:[180f,0f]}"

[[step]]
expect = { entity = "bee", baby = false }

[[step]]
expect = { entity = "bee", baby = true }

[[step]]
look_at = [-29.5, -59.5, 4.0]

# Chat fades after 10 seconds.
[[step]]
wait_ms = 11000

[[step]]
screenshot = "bees"

[[step]]
chat = "/kill @e[type=minecraft:bee]"

[[step]]
chat = "/fill -30 -60 0 -30 -58 0 minecraft:air"

[[step]]
chat = "/gamerule advance_time true"
