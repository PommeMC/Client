# Allay, snow golem, copper golems (unaffected and weathered), wandering trader
# and sulfur cubes (adult and baby), at rest from above. The snow golem is
# sheared, since its carved pumpkin isn't drawn yet.

[[step]]
wait_ms = 2000

[[step]]
chat = "/gamemode creative"

[[step]]
chat = "/gamerule advance_time false"

[[step]]
chat = "/time set 6000"

[[step]]
deterministic = true

# A pillar to look down from.
[[step]]
chat = "/fill 0 -60 0 0 -58 0 minecraft:stone"

[[step]]
chat = "/tp @s 0.5 -57 0.5 0 40"

[[step]]
expect = { player = { position = [0.5, -57.0, 0.5] } }

[[step]]
chat = "/summon minecraft:snow_golem -4 -60 7 {NoAI:1b,Pumpkin:0b,Rotation:[160f,0f]}"

[[step]]
expect = { entity = "snow_golem" }

[[step]]
chat = "/summon minecraft:copper_golem -1.5 -60 6 {NoAI:1b,Rotation:[180f,0f]}"

[[step]]
chat = '/summon minecraft:copper_golem -2 -60 8.5 {NoAI:1b,weather_state:"weathered",Rotation:[200f,0f]}'

[[step]]
expect = { entity = "copper_golem" }

[[step]]
chat = "/summon minecraft:allay 0.5 -58.5 5 {NoAI:1b,Rotation:[180f,0f]}"

[[step]]
expect = { entity = "allay" }

[[step]]
chat = "/summon minecraft:wandering_trader 2.5 -60 7 {NoAI:1b,Rotation:[200f,0f]}"

[[step]]
expect = { entity = "wandering_trader" }

[[step]]
chat = "/summon minecraft:sulfur_cube 5 -60 6 {NoAI:1b,Size:1,Rotation:[180f,0f]}"

[[step]]
chat = "/summon minecraft:sulfur_cube 4 -60 4 {NoAI:1b,Size:0,Age:-24000,Rotation:[180f,0f]}"

[[step]]
expect = { entity = "sulfur_cube" }

[[step]]
look_at = [0.5, -59.5, 6.0]

# Chat fades after 10 seconds.
[[step]]
wait_ms = 11000

[[step]]
screenshot = "passive_mobs"

# An idle copper golem spins its head every 210 to 249 ticks, with its
# weathering's sound.
[[step]]
chat = '/summon minecraft:copper_golem 6 -60 2 {weather_state:"weathered"}'

[[step]]
expect = { sound = "entity.copper_golem_weathered.spin" }
timeout_ms = 15000

[[step]]
chat = "/kill @e[type=!player]"

[[step]]
chat = "/fill 0 -60 0 0 -58 0 minecraft:air"

[[step]]
chat = "/gamerule advance_time true"
