# A mob's shadow while it interpolates: each round nudges the pig by one
# wire step (1/4096 of a block), which starts an interpolation, and every
# frame of it must match the still one. The nudge flips a few pixels along
# the pig's edges; a lost shadow changes thousands.

[[step]]
wait_ms = 2000

[[step]]
chat = "/gamemode creative"

[[step]]
chat = "/gamerule advance_time false"

[[step]]
chat = "/time set 6000"

# A pillar to look down from.

[[step]]
chat = "/fill 0 -60 0 0 -58 0 minecraft:stone"

[[step]]
chat = "/tp @s 0.5 -57 0.5 0 50"

[[step]]
chat = '/summon minecraft:pig 0.5 -60 4.5 {NoAI:1b,Silent:1b,Rotation:[180f,0f]}'

[[step]]
expect = { entity = "pig" }

[[step]]
look_at = [0.5, -60.0, 4.5]

[[step]]
press = { action = "key.toggleGui" }

[[step]]
deterministic = true

# Chat fades after 10 seconds.

[[step]]
wait_ms = 11000

[[step]]
screenshot = "still"

[[step]]
chat = '/execute as @e[type=pig] at @s run tp @s ~0.000244140625 ~ ~'

[[step]]
wait_ms = 30

[[step]]
screenshot = "moved_0_0"

[[step]]
match_screenshots = ["still", "moved_0_0"]
max_differing_pixels = 100

[[step]]
wait_ms = 30

[[step]]
screenshot = "moved_0_1"

