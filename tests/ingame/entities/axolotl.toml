# Axolotls, three-quarter view from above: the five variants as adults
# (back row) and babies (front row) on the grass, then an adult and a baby
# hovering in a pool. The baby is its own keyframed 32x32 mesh, not a scaled
# adult.

[[step]]
wait_ms = 2000

[[step]]
chat = "/gamemode creative"

[[step]]
chat = "/gamerule advance_time false"

[[step]]
chat = "/time set 6000"

[[step]]
deterministic = true

# A pillar to look down from.
[[step]]
chat = "/fill 0 -60 0 0 -58 0 minecraft:stone"

[[step]]
chat = "/tp @s 0.5 -57 0.5 0 40"

[[step]]
expect = { player = { position = [0.5, -57.0, 0.5] } }

[[step]]
chat = "/summon minecraft:axolotl -2.5 -60 6.5 {NoAI:1b,Variant:0,Rotation:[160f,0f]}"

[[step]]
chat = "/summon minecraft:axolotl -1 -60 6.5 {NoAI:1b,Variant:1,Rotation:[160f,0f]}"

[[step]]
chat = "/summon minecraft:axolotl 0.5 -60 6.5 {NoAI:1b,Variant:2,Rotation:[160f,0f]}"

[[step]]
chat = "/summon minecraft:axolotl 2 -60 6.5 {NoAI:1b,Variant:3,Rotation:[160f,0f]}"

[[step]]
chat = "/summon minecraft:axolotl 3.5 -60 6.5 {NoAI:1b,Variant:4,Rotation:[160f,0f]}"

[[step]]
expect = { entity = "axolotl", baby = false }

[[step]]
chat = "/summon minecraft:axolotl -2.5 -60 4 {NoAI:1b,Variant:0,Age:-24000,Rotation:[200f,0f]}"

[[step]]
chat = "/summon minecraft:axolotl -1 -60 4 {NoAI:1b,Variant:1,Age:-24000,Rotation:[200f,0f]}"

[[step]]
chat = "/summon minecraft:axolotl 0.5 -60 4 {NoAI:1b,Variant:2,Age:-24000,Rotation:[200f,0f]}"

[[step]]
chat = "/summon minecraft:axolotl 2 -60 4 {NoAI:1b,Variant:3,Age:-24000,Rotation:[200f,0f]}"

[[step]]
chat = "/summon minecraft:axolotl 3.5 -60 4 {NoAI:1b,Variant:4,Age:-24000,Rotation:[200f,0f]}"

[[step]]
expect = { entity = "axolotl", baby = true }

[[step]]
look_at = [0.5, -60.0, 5.0]

# Chat fades after 10 seconds.
[[step]]
wait_ms = 11000

[[step]]
screenshot = "on_ground"

[[step]]
chat = "/kill @e[type=!player]"

# A two-deep pool cut into the dirt and grass.
[[step]]
chat = "/fill -2 -62 3 3 -61 7 minecraft:water"

[[step]]
expect = { block = "water", at = [-2, -62, 3] }

[[step]]
chat = "/summon minecraft:axolotl -0.5 -61.6 5.5 {NoAI:1b,Variant:0,Rotation:[150f,0f]}"

[[step]]
expect = { entity = "axolotl", baby = false }

[[step]]
chat = "/summon minecraft:axolotl 2 -61.6 4.5 {NoAI:1b,Variant:4,Age:-24000,Rotation:[230f,0f]}"

[[step]]
expect = { entity = "axolotl", baby = true }

[[step]]
look_at = [0.5, -61.5, 5.0]

[[step]]
wait_ms = 11000

[[step]]
screenshot = "in_water"

[[step]]
chat = "/kill @e[type=!player]"

[[step]]
chat = "/fill -2 -62 3 3 -62 7 minecraft:dirt"

[[step]]
chat = "/fill -2 -61 3 3 -61 7 minecraft:grass_block"

[[step]]
expect = { block = "grass_block", at = [-2, -61, 3] }

[[step]]
chat = "/fill 0 -60 0 0 -58 0 minecraft:air"

[[step]]
chat = "/gamerule advance_time true"
