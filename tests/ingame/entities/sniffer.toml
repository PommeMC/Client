# Sniffer and snifflet at rest, three-quarter view from above. The baby is
# its own 128x128 mesh, not a scaled adult.

[[step]]
wait_ms = 2000

[[step]]
chat = "/gamemode creative"

[[step]]
chat = "/gamerule advance_time false"

[[step]]
chat = "/time set 6000"

[[step]]
deterministic = true

# A pillar to look down from.
[[step]]
chat = "/fill 0 -60 0 0 -58 0 minecraft:stone"

[[step]]
chat = "/tp @s 0.5 -57 0.5 0 40"

[[step]]
expect = { player = { position = [0.5, -57.0, 0.5] } }

[[step]]
chat = "/summon minecraft:sniffer -1.5 -60 6.5 {NoAI:1b,Rotation:[150f,0f]}"

[[step]]
expect = { entity = "sniffer", baby = false }

[[step]]
chat = "/summon minecraft:sniffer 3 -60 5 {NoAI:1b,Age:-24000,Rotation:[210f,0f]}"

[[step]]
expect = { entity = "sniffer", baby = true }

[[step]]
look_at = [0.5, -59.5, 6.0]

# Chat fades after 10 seconds.
[[step]]
wait_ms = 11000

[[step]]
screenshot = "sniffers"

[[step]]
chat = "/kill @e[type=!player]"

[[step]]
chat = "/fill 0 -60 0 0 -58 0 minecraft:air"

[[step]]
chat = "/gamerule advance_time true"
