# Turtles at rest, three-quarter view from above: a plain adult, an adult
# carrying an egg (egg belly shown, whole body lifted a pixel) and a baby,
# which is its own 16x16 mesh drawn backface-culled.

[[step]]
wait_ms = 2000

[[step]]
chat = "/gamemode creative"

[[step]]
chat = "/gamerule advance_time false"

[[step]]
chat = "/time set 6000"

[[step]]
deterministic = true

# A pillar to look down from.
[[step]]
chat = "/fill 0 -60 0 0 -58 0 minecraft:stone"

[[step]]
chat = "/tp @s 0.5 -57 0.5 0 40"

[[step]]
expect = { player = { position = [0.5, -57.0, 0.5] } }

[[step]]
chat = "/summon minecraft:turtle -2 -60 5.5 {NoAI:1b,Rotation:[150f,0f]}"

[[step]]
expect = { entity = "turtle", baby = false }

[[step]]
chat = "/summon minecraft:turtle 2 -60 6 {NoAI:1b,has_egg:1b,Rotation:[210f,0f]}"

[[step]]
chat = "/summon minecraft:turtle 0.5 -60 3.5 {NoAI:1b,Age:-24000,Rotation:[180f,0f]}"

[[step]]
expect = { entity = "turtle", baby = true }

[[step]]
look_at = [0.5, -59.8, 5.0]

# Chat fades after 10 seconds.
[[step]]
wait_ms = 11000

[[step]]
screenshot = "turtles"

[[step]]
chat = "/kill @e[type=!player]"

[[step]]
chat = "/fill 0 -60 0 0 -58 0 minecraft:air"

[[step]]
chat = "/gamerule advance_time true"
