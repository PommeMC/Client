# Components the client reads nothing from stay on the stack with the rest.

[[step]]
wait_ms = 2000

[[step]]
chat = '/give @s minecraft:diamond_pickaxe[minecraft:can_break={blocks:"minecraft:stone"},minecraft:custom_name="Miner"]'

[[step]]
expect = { slot = 36, item = "diamond_pickaxe", components = ["custom_name", "can_break"] }

[[step]]
chat = '/give @s minecraft:stone[minecraft:can_place_on={blocks:"minecraft:dirt"},minecraft:rarity="epic"] 3'

[[step]]
expect = { slot = 37, item = "stone", count = 3, components = ["rarity", "can_place_on"] }
