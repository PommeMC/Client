# A chest opens through a right click with its contents, and the server
# closes the screen when the chest goes away.

[[step]]
wait_ms = 2000

[[step]]
chat = "/setblock 0 -60 3 minecraft:chest{Items:[{Slot:0b,id:\"minecraft:diamond\",count:3}]}"

[[step]]
chat = "/tp @s 0.5 -60 0.5 0 0"

[[step]]
expect = { block = "chest", at = [0, -60, 3], block_entity = "chest" }

[[step]]
look_at = [0.5, -59.5, 3.0]

# Held for a few ticks, as a click is.
[[step]]
mouse_down = "right"

[[step]]
wait_ms = 150

[[step]]
mouse_up = "right"

[[step]]
expect = { menu = "generic_9x3", title = "Chest" }

[[step]]
expect = { slot = 0, item = "diamond", count = 3 }

[[step]]
wait_ms = 500

[[step]]
screenshot = "chest"

[[step]]
chat = "/setblock 0 -60 3 minecraft:air"

[[step]]
expect = { menu = "none" }
