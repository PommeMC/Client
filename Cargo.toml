[workspace]
resolver = "3"
members = [
    "pomme-android",
    "pomme-relay",
    "pomme-ios",
    "pomme-auth",
    "pomme-install",
    "pomme-client",
    "pomme-gpu-allocator",
    "pomme-block",
    "pomme-registry",
    "pomme-text",
    "pomme-item",
    "pomme-dirs",
    "pomme-protocol",
    "pomme-singleplayer",
    "tools/blockgen",
    "tools/ingame-test",
    "tools/protogen",
    "tools/typegen"
]
# Steel is its own workspace; pomme-singleplayer reaches into it by path.
exclude = ["third_party/SteelMC"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
directories = "6"
sha1_smol = "1"
open = "5"
base64 = "0.23"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
# Pin the reviewed MutBorrow/self-referential API used by ZIP entry streams.
self_cell = "1.2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json"] }
# Shared by pomme-client and pomme-protocol; the versions must agree so
# glam types unify across the crate boundary.
glam = "0.34"

# client
pyronyx = "=0.5.1"
regex = "1"
# Secure chat.
chrono = { version = "0.4.44", features = ["serde"] }
rand = "0.10.2"
rsa = "0.10.0-rc.18"
sha1 = "0.11"
sha2 = "0.11"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.dev]
opt-level = 1
# Backtraces and profilers keep file:line; full local-variable debuginfo is
# opt-in via CARGO_PROFILE_DEV_DEBUG=full.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

# The release build with symbols, for `just profile`.
[profile.samply]
inherits = "release"
debug = true

# Mirrors steel's own dev overrides. Its workspace profile does not apply when
# pomme is the root, and without these worldgen is unusably slow and the density
# functions overflow-panic.
[profile.dev.package.steel-worldgen]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.steel-math]
opt-level = 3
debug-assertions = false
overflow-checks = false
