name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: client
          cache-on-failure: true

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa
        with:
          vulkan_version: 1.4.341.0
          install_runtime: false
          cache: true
          stripdown: true

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev libxkbcommon-dev libwayland-dev libasound2-dev libudev-dev

      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo fmt -p pomme-client -- --check
          cargo fmt -p pomme-protocol -- --check

      - name: Clippy
        run: |
          cargo clippy -p pomme-client --release --all-targets --all-features -- -D warnings
          cargo clippy -p pomme-protocol --release --all-targets --all-features -- -D warnings

      - name: Tests
        if: matrix.os == 'ubuntu-latest'
        # --release reuses the dependency artifacts the clippy step built.
        run: |
          cargo test -p pomme-protocol
          cargo test -p pomme-client --release

  pr-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check PR template and labeler agree
        # The labeler matches checkbox text exactly, so a reworded box silently
        # stops applying its label.
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          def read(path):
              # Normalized, so a CRLF checkout doesn't look like a missing section.
              return pathlib.Path(path).read_text(encoding="utf-8").replace("\r\n", "\n")

          template = read(".github/PULL_REQUEST_TEMPLATE.md")
          workflow = read(".github/workflows/pr-tags.yml")

          section = re.search(r"## Type of change\n(.*?)(?=\n## |\Z)", template, re.S)
          if section is None:
              sys.exit("::error::PULL_REQUEST_TEMPLATE.md has no '## Type of change' section")

          boxes = set(re.findall(r"^- \[ \] (.+)$", section.group(1), re.M))
          mapped = set(re.findall(r'text:\s*"([^"]+)"', workflow))

          drift = [f"checkbox {t!r} has no label in pr-tags.yml" for t in sorted(boxes - mapped)]
          drift += [f"pr-tags.yml maps {t!r}, which is not a checkbox" for t in sorted(mapped - boxes)]
          for problem in drift:
              print(f"::error::{problem}")
          if drift:
              sys.exit(1)
          print(f"{len(boxes)} checkboxes match their label mappings")
          PY

  launcher-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Format check
        run: pnpm --filter pomme-launcher format:check

      - name: Lint
        run: pnpm --filter pomme-launcher lint

      - name: Type check
        run: pnpm --filter pomme-launcher exec tsc --noEmit

  launcher:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: launcher
          cache-on-failure: true

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt -p pomme-launcher -- --check

      - name: Clippy
        run: cargo clippy -p pomme-launcher --release --all-targets --all-features -- -D warnings

      - name: Check bindings are up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo run -p pomme-launcher --quiet --bin generate-bindings
          if ! git diff --exit-code -- ./pomme-launcher/src/bindings; then
            echo "::error::pomme-launcher/src/bindings is stale. Run 'cargo run -p pomme-launcher --bin generate-bindings' and commit."
            exit 1
          fi
