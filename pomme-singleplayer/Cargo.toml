[package]
name = "pomme-singleplayer"
version = "0.1.0"
edition = "2024"
# Links SteelMC, which is AGPL-3.0-or-later, so this crate is too. GPLv3 section
# 13 permits the combination with the GPL-3.0-or-later client.
license = "AGPL-3.0-or-later"

[dependencies]
steel-core = { git = "https://github.com/Steel-Foundation/SteelMC.git", rev = "9142c96" }
steel-login = { git = "https://github.com/Steel-Foundation/SteelMC.git", rev = "9142c96" }
steel-registry = { git = "https://github.com/Steel-Foundation/SteelMC.git", rev = "9142c96" }
steel-utils = { git = "https://github.com/Steel-Foundation/SteelMC.git", rev = "9142c96" }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = { workspace = true }
