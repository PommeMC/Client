[package]
name = "pomme-particle-macros"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { version = "=1.0.107", default-features = false, features = ["proc-macro"] }
quote = { version = "=1.0.47", default-features = false, features = ["proc-macro"] }
syn = { version = "=2.0.117", default-features = false, features = ["derive", "parsing", "printing", "proc-macro"] }
