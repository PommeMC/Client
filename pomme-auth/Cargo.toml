[package]
name = "pomme-auth"
description = "Microsoft account sign-in for Minecraft, for the Pomme client."
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[features]
# The OS credential store, on desktop.
keyring = ["dep:keyring"]

[dependencies]
reqwest = { workspace = true, features = ["form"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time"] }
keyring = { version = "3", features = ["apple-native", "sync-secret-service", "windows-native"], optional = true }
