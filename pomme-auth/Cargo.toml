[package]
name = "pomme-auth"
description = "Microsoft account sign-in for Minecraft, for the Pomme client."
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[features]
# The OS credential store, on desktop.
keyring = ["dep:keyring"]

[dependencies]
base64 = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["form"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "time"] }
keyring = { version = "3", features = ["apple-native", "sync-secret-service", "windows-native"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt"] }
